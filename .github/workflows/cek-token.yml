name: Cek token Threads

on:
  workflow_dispatch:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semak token (tak post apa-apa)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_VITALIQ_ACCESS_TOKEN: ${{ secrets.THREADS_VITALIQ_ACCESS_TOKEN }}
          THREADS_FARZ_ACCESS_TOKEN: ${{ secrets.THREADS_FARZ_ACCESS_TOKEN }}
        run: python cek_token.py
