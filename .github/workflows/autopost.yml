name: Auto Post IG & Threads

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Siar post id ini sekarang (kosongkan untuk jalan biasa)"
        required: false
      dry_run:
        description: "Dry run (tak post betul-betul)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Siar post (loop ~5.5 jam supaya tak bergantung pada cron GitHub yang lambat)
        timeout-minutes: 345
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.instagram.com' }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/content/images
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          save_state() {
            git add state/posted.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "Rekod auto post"
              for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && break; sleep 5; done
            fi
          }
          # Sekali jalan sahaja kalau dry run atau --only
          if [ ${#ARGS[@]} -gt 0 ]; then python autopost.py "${ARGS[@]}" || true; save_state; exit 0; fi
          END=$(( $(date +%s) + 330*60 ))
          while :; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            python autopost.py || echo "Ada post gagal (lihat log di atas)"
            save_state
            [ $(date +%s) -ge $END ] && break
            sleep 240
          done
          # Sambung sendiri: start run baru supaya tak bergantung pada cron GitHub
          gh workflow run autopost.yml --ref "${GITHUB_REF_NAME}" || echo "Gagal start run seterusnya, tunggu cron"
